{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "neural-network-design.fullname" . }}
  labels:
    {{- include "neural-network-design.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "neural-network-design.selectorLabels" . | nindent 6 }}
{{- end }}
