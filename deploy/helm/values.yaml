replicaCount: 2

image:
  repository: ghcr.io/scaibu/neural-network-design
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: neural-network-design.llmobs.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env:
  APP_ENV: "production"
  PORT: "8080"
  DATABASE_URL: "postgresql://alloy_admin:alloysecret@alloydb.llmobs.internal:5432/policy_orchestration"
  DB_POOL_SIZE: "10"
  DB_TIMEOUT_MS: "5000"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.llmobs.internal:9092"
  KAFKA_TOPIC_RAW: "telemetry.spans.raw"
  KAFKA_TOPIC_SANITIZED: "telemetry.spans.sanitized"
  KAFKA_CONSUMER_GROUP: "neural-network-telemetry-group"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.llmobs.internal:4317"
  OTEL_SERVICE_NAME: "neural-network-design"
