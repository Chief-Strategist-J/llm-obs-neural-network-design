apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llmobs-dev

resources:
  - ../../base

namePrefix: dev-

images:
  - name: ghcr.io/scaibu/neural-network-design
    newTag: dev-latest

patches:
  - target:
      kind: Deployment
      name: neural-network-design
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
