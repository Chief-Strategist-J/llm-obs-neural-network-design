apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llmobs-prod

resources:
  - ../../base

images:
  - name: ghcr.io/scaibu/neural-network-design
    newTag: v1.0.0

patches:
  - target:
      kind: Deployment
      name: neural-network-design
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
