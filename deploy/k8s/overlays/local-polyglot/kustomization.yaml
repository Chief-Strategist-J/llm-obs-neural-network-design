apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llmobs-local

resources:
  - ../../base

namePrefix: local-

patches:
  - target:
      kind: Deployment
      name: neural-network-design
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: neural-network-design:latest
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
