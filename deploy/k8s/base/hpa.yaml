apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neural-network-design-hpa
  labels:
    app.kubernetes.io/name: neural-network-design
    app.kubernetes.io/part-of: llm-obs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neural-network-design
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
