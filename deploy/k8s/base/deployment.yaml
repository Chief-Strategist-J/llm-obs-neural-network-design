apiVersion: apps/v1
kind: Deployment
metadata:
  name: neural-network-design
  labels:
    app.kubernetes.io/name: neural-network-design
    app.kubernetes.io/part-of: llm-obs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neural-network-design
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neural-network-design
    spec:
      containers:
        - name: neural-network-design
          image: ghcr.io/scaibu/neural-network-design:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: neural-network-design-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
