version: '3.8'

services:
  neural-network-design:
    build:
      context: ../../..
      dockerfile: deploy/docker/service/Dockerfile
    container_name: neural-network-design
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - DATABASE_URL=postgresql://alloy_admin:alloysecret@host.docker.internal:5432/policy_orchestration
      - KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092
      - KAFKA_TOPIC_RAW=telemetry.spans.raw
      - KAFKA_TOPIC_SANITIZED=telemetry.spans.sanitized
      - KAFKA_CONSUMER_GROUP=neural-network-telemetry-group
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - OTEL_SERVICE_NAME=neural-network-design
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
