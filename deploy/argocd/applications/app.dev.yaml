apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neural-network-design-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: neural-network-design
    env: dev
spec:
  project: neural-network-design
  source:
    repoURL: https://github.com/scaibu/llm-obs-python-packages
    targetRevision: main
    path: neural-network-design/deploy/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: llmobs-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
