[project]
name = "llm-obs-neural-network-design"
version = "0.1.0"
description = "Neural Network Design service and architecture for LLM Observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-shared",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0"
]

[tool.pytest.ini_options]
pythonpath = [".", "../python-shared/src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pyright]
extraPaths = [".", "../python-shared/src"]
